schema: spec-driven

context: |
  macOS menu bar app that wraps YouTube Music (music.youtube.com).
  Tech stack: Tauri v2 (Rust core), React + TypeScript frontend, pnpm.
  Target: macOS only (Apple Silicon, MacBook with notch).
  Keep changes small: one feature per change, about 10 tasks or fewer.
  Keep docs short: bullets, simple words, no em dashes.

